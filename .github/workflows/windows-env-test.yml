name: Test Windows NEURON Environment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-windows-env:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Set up Miniconda and create the environment from environment_windows.yml
      - name: Set up Miniconda and create environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          # This must match the name inside environment_windows.yml
          activate-environment: neuron_env
          environment-file: environment_windows.yml
          auto-activate-base: false
          python-version: "3.10"
          channels: conda-forge, defaults
          use-mamba: true

      - name: Show Python and basic info
        run: |
          python -V
          python -c "import platform; print('Platform:', platform.platform())"
          python -c "import sys; print('Python executable:', sys.executable)"

      - name: Test core scientific stack
        run: |
          python -c "import numpy, scipy, matplotlib, pandas; \
          print('NumPy:', numpy.__version__); \
          print('SciPy:', scipy.__version__); \
          print('Matplotlib:', matplotlib.__version__); \
          print('Pandas:', pandas.__version__)"

      - name: Install NEURON via pip
        run: |
          pip install neuron==8.2.6
      
